name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          SOLUTION="$(find . -maxdepth 1 -name '*.slnx' -print -quit)"
          if [[ -z "$SOLUTION" ]]; then
            echo "::error::No solution file was found at the repository root."
            exit 1
          fi
          echo "SOLUTION=$SOLUTION" >> "$GITHUB_ENV"
          dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-restore --no-build

      # Apply database migrations before tests in non-docker context
      - name: Apply Database Migrations
        if: runner.os == 'Linux' && !startsWith(github.ref, 'refs/heads/main')
        run: |
          $migrationProjects = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/src/Infrastructure" -Filter "*Migrations*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($migrationProjects) {
            & dotnet ef database update --project $migrationProjects.Name --startup-project "$env:GITHUB_WORKSPACE/src/Web.Api" --configuration Release
          }

      - name: Publish
        run: dotnet publish "$SOLUTION" --configuration Release --no-restore --no-build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f src/Web.Api/Dockerfile -t web-api:ci .

      - name: Compose smoke test
        run: |
          # Run migrations in Docker container before starting the app
          docker compose -f docker-compose.yml exec web-api dotnet ef database update --project src/Infrastructure/Data --startup-project src/Web.Api --configuration Release || true

          docker compose -f docker-compose.yml up -d --build web-api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health/ready > /dev/null; then
              echo "web-api is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web-api did not become healthy within 60s"
          docker compose -f docker-compose.yml logs web-api
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
