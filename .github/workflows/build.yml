name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "10.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: |
          SOLUTION="$(find . -maxdepth 1 -name '*.slnx' -print -quit)"
          if [[ -z "$SOLUTION" ]]; then
            echo "::error::No solution file was found at the repository root."
            exit 1
          fi
          echo "SOLUTION=$SOLUTION" >> "$GITHUB_ENV"
          dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      - name: Test
        run: dotnet test "$SOLUTION" --configuration Release --no-restore --no-build

      - name: Publish
        run: dotnet publish "$SOLUTION" --configuration Release --no-restore --no-build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -f src/Web.Api/Dockerfile -t web-api:ci .

      - name: Compose smoke test
        run: |
          docker compose -f docker-compose.yml up -d --build web-api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health > /dev/null; then
              echo "web-api is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::web-api did not become healthy within 60s"
          docker compose -f docker-compose.yml logs web-api
          exit 1

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
