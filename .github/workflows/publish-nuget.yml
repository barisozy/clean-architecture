name: Publish NuGet Template

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Verify release tag matches package version
        run: |
          PROJECT_VERSION="$(dotnet msbuild CleanArchitecture.Template.csproj -getProperty:Version -nologo)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package version $PROJECT_VERSION."
            exit 1
          fi

      - name: Pack full solution template
        run: dotnet pack CleanArchitecture.Template.csproj --configuration Release --output ./artifacts

      - name: Verify NuGet API key is configured
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "::error::Add the NUGET_API_KEY repository secret before publishing."
            exit 1
          fi

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
